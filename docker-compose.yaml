services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER} # Variables desde .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No expongas el puerto 5432 al host (solo accesible desde la red interna de Docker)
  
  web:
    build: .
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: ${DATABASE_URL} # Variable desde .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
