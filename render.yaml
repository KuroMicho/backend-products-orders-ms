services:
  - type: web
    plan: free
    name: app
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

databases:
  - name: db
    plan: free
    postgresMajorVersion: "15"
    databaseName: products_db